name: Bug report
description: Report something that is not working correctly
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Immersion Deck Builder. Do not include private cards, credentials, or personal data.
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options: [Windows, Debian or Ubuntu, Other Linux]
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "Example: 3.13.5"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Click…\n3. See error…"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell

